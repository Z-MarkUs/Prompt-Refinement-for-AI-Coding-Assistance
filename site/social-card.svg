<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Prompt Refinement, Tested</title>
  <desc id="description">Social card for a reproducible re-analysis of a historical 200-task AI coding experiment whose result was no demonstrated improvement.</desc>
  <rect width="1200" height="630" fill="#0b1520"/>
  <circle cx="1110" cy="-35" r="235" fill="none" stroke="#c9ff55" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="1110" cy="-35" r="175" fill="none" stroke="#c9ff55" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="64" y="56" width="52" height="52" rx="26" fill="#c9ff55"/>
  <text x="90" y="88" text-anchor="middle" fill="#0b1520" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="800">PR</text>
  <text x="132" y="77" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">PROMPT REFINEMENT</text>
  <text x="132" y="99" fill="#9ba8b4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.8">HISTORICAL EVALUATION</text>

  <text x="64" y="190" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="750" letter-spacing="-3">Prompt refinement,</text>
  <text x="64" y="259" fill="#c9ff55" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-style="italic" letter-spacing="-2">tested—not assumed.</text>
  <text x="64" y="310" fill="#bdc6ce" font-family="Inter, Arial, sans-serif" font-size="21">A reproducible re-analysis of a historical 200-task</text>
  <text x="64" y="339" fill="#bdc6ce" font-family="Inter, Arial, sans-serif" font-size="21">AI coding experiment with an honest negative result.</text>

  <rect x="64" y="390" width="620" height="94" rx="14" fill="#111d29" stroke="#31404f"/>
  <rect x="64" y="390" width="6" height="94" rx="3" fill="#ff6b62"/>
  <text x="92" y="421" fill="#ff8a83" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">OBSERVED CONCLUSION</text>
  <text x="92" y="458" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="760">No demonstrated improvement.</text>

  <rect x="754" y="66" width="382" height="468" rx="22" fill="#111d29" stroke="#31404f"/>
  <text x="790" y="109" fill="#9ba8b4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.3">PUBLISHED ACCEPTANCE</text>

  <text x="790" y="162" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Direct GPT-3.5</text>
  <text x="1100" y="162" text-anchor="end" fill="#c9ff55" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="800">68.0%</text>
  <rect x="790" y="179" width="310" height="10" rx="5" fill="#22313f"/>
  <rect x="790" y="179" width="211" height="10" rx="5" fill="#c9ff55"/>

  <text x="790" y="237" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Fine-tuned refiner</text>
  <text x="1100" y="237" text-anchor="end" fill="#c9ff55" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="800">64.3%</text>
  <rect x="790" y="254" width="310" height="10" rx="5" fill="#22313f"/>
  <rect x="790" y="254" width="199" height="10" rx="5" fill="#c9ff55"/>

  <text x="790" y="312" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">GPT-4o refiner</text>
  <text x="1100" y="312" text-anchor="end" fill="#ff8a83" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="800">27.6%</text>
  <rect x="790" y="329" width="310" height="10" rx="5" fill="#22313f"/>
  <rect x="790" y="329" width="86" height="10" rx="5" fill="#ff6b62"/>

  <line x1="790" y1="379" x2="1100" y2="379" stroke="#31404f"/>
  <text x="790" y="418" fill="#9ba8b4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2">PAIRED DIRECT VS FINE-TUNED</text>
  <text x="790" y="458" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760">−3.61 pp</text>
  <text x="1100" y="458" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">p = 0.3368</text>
  <text x="790" y="492" fill="#9ba8b4" font-family="Inter, Arial, sans-serif" font-size="14">194 shared task IDs · exact McNemar</text>

  <text x="64" y="568" fill="#c9ff55" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">HEHAN ZHAO · EVIDENCE-FIRST AI ENGINEERING</text>
  <text x="1136" y="568" text-anchor="end" fill="#9ba8b4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">Z-MarkUs / GitHub</text>
  <line x1="64" y1="592" x2="1136" y2="592" stroke="#31404f"/>
</svg>

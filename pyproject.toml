[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "prompt-refinement-eval"
version = "0.2.0"
description = "A reproducible re-analysis of a historical prompt-refinement coding experiment."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hehan Zhao" },
]
keywords = ["llm", "evaluation", "prompt-engineering", "code-generation", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.68,<3"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "openai>=1.68,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
prompt-refinement-eval = "prompt_refinement_eval.cli:main"

[project.urls]
Homepage = "https://z-markus.github.io/Prompt-Refinement-for-AI-Coding-Assistance/"
Repository = "https://github.com/Z-MarkUs/Prompt-Refinement-for-AI-Coding-Assistance"
Issues = "https://github.com/Z-MarkUs/Prompt-Refinement-for-AI-Coding-Assistance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_refinement_eval"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/THIRD_PARTY_NOTICES.md",
  "/constraints/ci.txt",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["prompt_refinement_eval"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["prompt_refinement_eval"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade --constraint constraints/ci.txt pip
          python -m pip install --constraint constraints/ci.txt -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Type-check
        run: python -m mypy --strict

      - name: Audit dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit --skip-editable

      - name: Test with coverage
        run: >-
          python -m pytest
          --cov=prompt_refinement_eval
          --cov-report=term-missing
          --cov-report=xml

      - name: Build distributions
        run: python -m build

      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/prompt-refinement-eval --version
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/prompt-refinement-eval" analyze \
            --arm "direct=$GITHUB_WORKSPACE/AutoTest/leetcode_summary/3.5_score_readable.json" \
            --arm "refined=$GITHUB_WORKSPACE/AutoTest/leetcode_summary/finetuned_score_readable.json" \
            --output "$RUNNER_TEMP/wheel-analysis.json"
